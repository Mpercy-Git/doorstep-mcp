[project]
name = "doorstep-mcp"
version = "0.1.0"
description = "An MCP server that lets an agent see, speak and listen at a Frigate doorbell"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "mutagen>=1.47",
    "aiomqtt>=2.3",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
doorstep = "doorstep.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doorstep"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]  # ruff format owns line length
